<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Écran</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect x=%222%22 y=%225%22 width=%2228%22 height=%2220%22 rx=%223%22 fill=%22%231f6f5c%22/%3E%3Cpath d=%22M6 21l6-7 4 4 3-3 7 6z%22 fill=%22%23fff%22/%3E%3C/svg%3E">
<script src="config.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body.idle { cursor: none; }
  .slide {
    position: fixed; inset: 0; width: 100%; height: 100%;
    object-fit: contain; opacity: 0; transition: opacity .6s ease;
    user-select: none; -webkit-user-drag: none;
  }
  .slide.show { opacity: 1; }
  body.cover .slide { object-fit: cover; }
  #hint {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,.65); color: #eee; font: 14px system-ui, sans-serif;
    padding: 8px 16px; border-radius: 99px; transition: opacity .4s; pointer-events: none; white-space: nowrap;
  }
  body.idle #hint { opacity: 0; }
</style>
</head>
<body>
<img class="slide" id="a" alt="">
<img class="slide" id="b" alt="">
<div id="hint">Cliquez ou appuyez sur F pour le plein écran</div>

<script>
(() => {
  'use strict';
  const C = window.DISPLAY_CONFIG || {};
  const POLL = Math.max(2, C.pollSeconds || 3) * 1000;
  const API_URL = `https://api.github.com/repos/${C.owner}/${C.repo}/contents/${C.configPath}?ref=${C.branch}`;
  const layers = [document.getElementById('a'), document.getElementById('b')];
  let front = 0;
  let shownSrc = null;      // image actuellement affichée (null = écran noir)
  let wantedSrc;            // dernière image demandée
  let etag = null;
  let apiPausedUntil = 0;   // si l'API GitHub limite les requêtes, on passe par la copie du site

  const encPath = (p) => p.split('/').map(encodeURIComponent).join('/');
  function srcFromConfig(cfg) {
    const id = cfg.current;
    if (!id) return null;
    const im = (cfg.images || []).find((x) => x && (x.url || x.file) === id);
    if (!im) return null;
    return im.url || `https://raw.githubusercontent.com/${C.owner}/${C.repo}/${C.branch}/${encPath(im.file)}`;
  }

  // Lecture via l'API GitHub : à jour immédiatement. Les réponses « pas de changement » (304)
  // ne consomment pas de quota.
  async function fetchFromApi() {
    const headers = { Accept: 'application/vnd.github.raw+json' };
    if (etag) headers['If-None-Match'] = etag;
    const res = await fetch(API_URL, { headers, cache: 'no-store' });
    if (res.status === 304) return null;
    if (res.status === 403 || res.status === 429) {
      const reset = Number(res.headers.get('X-RateLimit-Reset')) * 1000;
      apiPausedUntil = reset > Date.now() ? reset + 1000 : Date.now() + 10 * 60 * 1000;
      throw new Error('limite API');
    }
    if (!res.ok) throw new Error('API ' + res.status);
    etag = res.headers.get('ETag');
    return res.json();
  }
  // Solution de secours : le config.json publié avec le site (mis à jour avec ~1 min de retard).
  async function fetchFromSite() {
    const res = await fetch(`${C.configPath}?t=${Date.now()}`, { cache: 'no-store' });
    if (!res.ok) throw new Error('site ' + res.status);
    return res.json();
  }

  let polling = false;
  async function poll() {
    if (polling) return;
    polling = true;
    try {
      let cfg;
      if (Date.now() >= apiPausedUntil) {
        try { cfg = await fetchFromApi(); }
        catch (e) { console.warn(e.message); cfg = await fetchFromSite(); }
      } else {
        cfg = await fetchFromSite();
      }
      if (cfg) apply(srcFromConfig(cfg), cfg.fit);
    } catch (e) {
      console.warn('Lecture impossible, nouvel essai bientôt', e);
    } finally {
      polling = false;
    }
  }

  function loadImage(src) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => (img.decode ? img.decode().catch(() => {}) : Promise.resolve()).then(resolve);
      img.onerror = () => reject(new Error('Image introuvable : ' + src));
      img.src = src;
    });
  }

  async function apply(src, fit) {
    document.body.classList.toggle('cover', fit === 'cover');
    if (src === wantedSrc) return;
    wantedSrc = src;
    if (src === shownSrc) return;
    if (src) {
      try { await loadImage(src); }
      catch (e) {
        console.warn(e.message);
        if (wantedSrc === src) wantedSrc = undefined; // on réessaiera au prochain passage
        return;
      }
      if (wantedSrc !== src) return; // un autre choix est arrivé entre-temps
      const back = 1 - front;
      layers[back].src = src;
      layers[back].classList.add('show');
      layers[front].classList.remove('show');
      front = back;
    } else {
      layers.forEach((l) => l.classList.remove('show'));
    }
    shownSrc = src;
  }

  // Mise à jour instantanée si la page de gestion est ouverte dans ce même navigateur.
  if ('BroadcastChannel' in window) {
    const ch = new BroadcastChannel(`displaylscs_${C.owner}_${C.repo}`);
    ch.onmessage = (e) => { if (e.data) apply(e.data.src, e.data.fit); };
  }

  // ---------- Plein écran, souris ----------
  function toggleFullscreen() {
    const d = document;
    if (!d.fullscreenElement && !d.webkitFullscreenElement) {
      const el = d.documentElement;
      (el.requestFullscreen || el.webkitRequestFullscreen || (() => {})).call(el);
    } else {
      (d.exitFullscreen || d.webkitExitFullscreen || (() => {})).call(d);
    }
  }
  document.addEventListener('click', toggleFullscreen);
  document.addEventListener('keydown', (e) => { if (e.key === 'f' || e.key === 'F') toggleFullscreen(); });

  let idleTimer;
  function wake() {
    document.body.classList.remove('idle');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => document.body.classList.add('idle'), 3000);
  }
  document.addEventListener('mousemove', wake);
  document.addEventListener('touchstart', wake, { passive: true });
  wake();

  // Garde l'écran allumé quand c'est possible.
  async function keepAwake() {
    try { if ('wakeLock' in navigator && document.visibilityState === 'visible') await navigator.wakeLock.request('screen'); }
    catch {}
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { keepAwake(); poll(); } });
  keepAwake();

  poll();
  setInterval(poll, POLL);
  // Rechargement complet toutes les 6 h pour récupérer d'éventuelles mises à jour de la page.
  setTimeout(() => location.reload(), 6 * 3600 * 1000);
})();
</script>
</body>
</html>
